<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" role="img" aria-label="AutoReady demo: a radar searches for a match, the match-found popup appears, AutoReady clicks Accept, and a notification reaches your PC and phone.">
  <defs>
    <radialGradient id="halo" cx="36%" cy="46%" r="60%">
      <stop offset="0" stop-color="#10B981" stop-opacity=".14"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#F5F4F0" stroke-opacity=".035"/>
    </pattern>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E3B33"/>
      <stop offset=".55" stop-color="#12121A"/>
      <stop offset="1" stop-color="#0A1A2B"/>
    </linearGradient>
    <symbol id="logo" viewBox="0 0 512 512">
      <rect width="512" height="512" rx="112" fill="#09090B"/>
      <g transform="translate(256 256) scale(.84) translate(-203 -283)">
        <polyline points="86.48,263.72 61.02,238.26" fill="none" stroke="#38BDF8" stroke-width="84"/>
        <polyline points="18.61,269.37 -4.02,246.74" fill="none" stroke="#10B981" stroke-width="84"/>
        <polyline points="78,292 188,402 352,198" fill="none" stroke="#F5F4F0" stroke-width="84" stroke-linejoin="miter"/>
        <polygon points="440,104 274,160 412,280" fill="#F5F4F0"/>
      </g>
    </symbol>
  </defs>
  <style>
    .d{font-family:"Segoe UI Variable Display","Segoe UI",Helvetica,Arial,sans-serif}
    .m{font-family:"Cascadia Mono",Consolas,Menlo,monospace}
  </style>

  <!-- Grid: margins 40; left column x 40-460 (popup + toast, same width), phone x 514-660.
       Popup and phone share the top edge (y 72); toast and phone share the bottom edge (y 368). -->
  <rect width="700" height="400" fill="#09090b"/>
  <rect width="700" height="400" fill="url(#halo)"/>
  <rect width="700" height="400" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="699" height="399" fill="none" stroke="#26262C"/>

  <!-- top bar: status + brand -->
  <circle cx="44" cy="34" r="5" fill="#F5F4F0">
    <animate attributeName="fill" values="#F5F4F0;#F5F4F0;#38BDF8;#38BDF8;#10B981;#10B981" keyTimes="0;.32;.34;.54;.56;1" dur="10s" repeatCount="indefinite" calcMode="discrete"/>
  </circle>
  <g class="m" font-size="11" letter-spacing="1.3">
    <text x="58" y="38" fill="#9A9AA3">SEARCHING FOR A MATCH
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.32;.34;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="58" y="38" fill="#7DD3FC" opacity="0">MATCH FOUND
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.33;.35;.54;.56;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="58" y="38" fill="#34D399" opacity="0">ACCEPTED
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.55;.57;.94;.97;1" dur="10s" repeatCount="indefinite"/></text>
  </g>
  <text class="m" x="660" y="38" font-size="11" letter-spacing="1.3" fill="#7C7C86" text-anchor="end">AUTOREADY</text>

  <!-- radar (centered on the popup: 250,160) -->
  <g transform="translate(-100 -35)">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.32;.35;1" dur="10s" repeatCount="indefinite"/>
    <g fill="none" stroke="#10B981" stroke-opacity=".28">
      <circle cx="350" cy="195" r="40"/>
      <circle cx="350" cy="195" r="80"/>
      <circle cx="350" cy="195" r="120"/>
      <path d="M230 195H470M350 75V315" stroke-opacity=".14"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 350 195" to="360 350 195" dur="2.4s" repeatCount="indefinite"/>
      <path d="M350 195L265.1 110.1A120 120 0 0 1 350 75Z" fill="#10B981" fill-opacity=".14"/>
      <path d="M350 195V75" stroke="#34D399" stroke-width="2" stroke-linecap="round"/>
    </g>
    <circle cx="350" cy="195" r="4" fill="#34D399"/>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.22;.24;.32;.35;1" dur="10s" repeatCount="indefinite"/>
      <circle cx="412" cy="148" r="6" fill="#38BDF8"/>
      <circle cx="412" cy="148" r="6" fill="none" stroke="#38BDF8" stroke-width="2">
        <animate attributeName="r" values="6;24" dur="1s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values=".8;0" dur="1s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- popup: x 40-460, y 72-248 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.33;.36;.94;.97;1" dur="10s" repeatCount="indefinite"/>
    <rect x="40" y="72" width="420" height="176" rx="16" fill="#141418" stroke="#38BDF8" stroke-width="1.5">
      <animate attributeName="stroke" values="#38BDF8;#38BDF8;#10B981;#10B981" keyTimes="0;.54;.56;1" dur="10s" repeatCount="indefinite" calcMode="discrete"/>
    </rect>
    <text class="m" x="250" y="106" font-size="11" letter-spacing="1.8" text-anchor="middle" fill="#7DD3FC">MATCH FOUND</text>
    <text class="d" x="250" y="140" font-size="26" font-weight="700" letter-spacing="-.5" text-anchor="middle" fill="#F5F4F0">Your match is ready</text>
    <rect x="70" y="156" width="360" height="4" rx="2" fill="#26262C"/>
    <rect x="70" y="156" width="360" height="4" rx="2" fill="#38BDF8">
      <animate attributeName="width" values="360;360;80;360;360" keyTimes="0;.34;.54;.56;1" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#38BDF8;#38BDF8;#10B981;#10B981" keyTimes="0;.54;.56;1" dur="10s" repeatCount="indefinite" calcMode="discrete"/>
    </rect>
    <rect x="70" y="178" width="360" height="52" rx="10" fill="#10B981"/>
    <g>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.54;.56;1" dur="10s" repeatCount="indefinite"/>
      <text class="m" x="250" y="209" font-size="15" font-weight="700" letter-spacing="2" text-anchor="middle" fill="#022C1E">ACCEPT</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.54;.56;1" dur="10s" repeatCount="indefinite"/>
      <path d="M192 203l6 6 11-12" fill="none" stroke="#022C1E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="m" x="222" y="209" font-size="15" font-weight="700" letter-spacing="2" fill="#022C1E">ACCEPTED</text>
    </g>
  </g>

  <!-- click ripple (button center 250,204) -->
  <circle cx="250" cy="204" r="0" fill="none" stroke="#F5F4F0" stroke-width="2" opacity="0">
    <animate attributeName="r" values="0;0;30;30" keyTimes="0;.52;.62;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.7;0;0" keyTimes="0;.52;.62;1" dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- cursor: clicks the button center, then drifts clear of the label -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.38;.40;.94;.97;1" dur="10s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="440 300;440 300;250 205;250 205;360 238;360 238" keyTimes="0;.38;.52;.54;.64;1" dur="10s" repeatCount="indefinite"/>
    <path d="M0 0L0 17L4.5 13L7.5 20L10.5 18.7L7.6 12H13Z" fill="#F5F4F0" stroke="#09090b" stroke-width="1.2" stroke-linejoin="round"/>
  </g>

  <!-- Windows toast: x 40-460, y 276-368 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.63;.66;.94;.97;1" dur="10s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 14;0 14;0 0;0 0" keyTimes="0;.63;.67;1" dur="10s" repeatCount="indefinite"/>
    <rect x="40" y="276" width="420" height="92" rx="8" fill="#2B2B2B" stroke="#454545"/>
    <use href="#logo" x="56" y="290" width="18" height="18"/>
    <text class="d" x="82" y="304" font-size="12.5" fill="#C5C5C5">AutoReady</text>
    <text class="d" x="444" y="304" font-size="12" fill="#8E8E8E" text-anchor="end">now</text>
    <text class="d" x="56" y="332" font-size="15" font-weight="600" fill="#FFFFFF">Match accepted in Dota 2</text>
    <text class="d" x="56" y="352" font-size="13.5" fill="#C5C5C5">Come back, it's starting.</text>
  </g>

  <!-- phone: x 514-660, y 72-368 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.69;.72;.94;.97;1" dur="10s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 14;0 14;0 0;0 0" keyTimes="0;.69;.73;1" dur="10s" repeatCount="indefinite"/>
    <rect x="514" y="72" width="146" height="296" rx="28" fill="#0B0B0E" stroke="#4A4A54" stroke-width="2"/>
    <rect x="518" y="76" width="138" height="288" rx="24" fill="url(#wall)"/>
    <rect x="564" y="84" width="46" height="13" rx="6.5" fill="#000"/>
    <text class="d" x="587" y="122" font-size="10" font-weight="600" text-anchor="middle" fill="#fff" fill-opacity=".75">Monday, November 9</text>
    <text class="d" x="587" y="162" font-size="46" font-weight="600" text-anchor="middle" fill="#fff" fill-opacity=".92">9:41</text>
    <rect x="524" y="182" width="126" height="76" rx="16" fill="#26262C" fill-opacity=".88" stroke="#fff" stroke-opacity=".08"/>
    <rect x="532" y="190" width="22" height="22" rx="6" fill="#338574"/>
    <path d="M537.500 196.500h11a1.500 1.500 0 0 1 1.500 1.500v6a1.500 1.500 0 0 1-1.500 1.500h-6l-3 2.500v-2.500h-2a1.500 1.500 0 0 1-1.500-1.500v-6a1.500 1.500 0 0 1 1.500-1.500z" fill="#fff"/>
    <text class="d" x="561" y="205" font-size="10" fill="#fff" fill-opacity=".6">ntfy</text>
    <text class="d" x="642" y="205" font-size="10" fill="#fff" fill-opacity=".45" text-anchor="end">now</text>
    <text class="d" x="532" y="228" font-size="11.500" font-weight="600" fill="#fff">Match accepted</text>
    <text class="d" x="532" y="243" font-size="10.500" fill="#fff" fill-opacity=".78">Come back, it's starting.</text>
    <circle cx="541" cy="334" r="14" fill="#fff" fill-opacity=".14"/>
    <circle cx="633" cy="334" r="14" fill="#fff" fill-opacity=".14"/>
    <rect x="564" y="354" width="46" height="4" rx="2" fill="#fff" fill-opacity=".7"/>
  </g>
</svg>
