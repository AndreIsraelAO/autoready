<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" role="img" aria-label="AutoReady demo: a radar searches for a match, the match-found popup appears, AutoReady clicks Accept, and a notification reaches your PC and phone.">
  <defs>
    <radialGradient id="halo" cx="50%" cy="46%" r="55%">
      <stop offset="0" stop-color="#10B981" stop-opacity=".16"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#F5F4F0" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <style>
    .d{font-family:"Segoe UI Variable Display","Segoe UI",Helvetica,Arial,sans-serif}
    .m{font-family:"Cascadia Mono",Consolas,Menlo,monospace}
  </style>

  <rect width="700" height="400" fill="#09090b"/>
  <rect width="700" height="400" fill="url(#halo)"/>
  <rect width="700" height="400" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="699" height="399" fill="none" stroke="#26262C"/>

  <!-- top bar: status + brand -->
  <circle cx="34" cy="34" r="5" fill="#F5F4F0">
    <animate attributeName="fill" values="#F5F4F0;#F5F4F0;#38BDF8;#38BDF8;#10B981;#10B981" keyTimes="0;.32;.34;.54;.56;1" dur="10s" repeatCount="indefinite" calcMode="discrete"/>
  </circle>
  <g class="m" font-size="11" letter-spacing="1.3">
    <text x="48" y="38" fill="#9A9AA3">SEARCHING FOR A MATCH
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.32;.34;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="48" y="38" fill="#7DD3FC" opacity="0">MATCH FOUND
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.33;.35;.54;.56;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="48" y="38" fill="#34D399" opacity="0">ACCEPTED
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.55;.57;.94;.97;1" dur="10s" repeatCount="indefinite"/></text>
  </g>
  <text class="m" x="666" y="38" font-size="11" letter-spacing="1.3" fill="#7C7C86" text-anchor="end">AUTOREADY</text>

  <!-- radar -->
  <g>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.32;.35;1" dur="10s" repeatCount="indefinite"/>
    <g fill="none" stroke="#10B981" stroke-opacity=".28">
      <circle cx="350" cy="195" r="40"/>
      <circle cx="350" cy="195" r="80"/>
      <circle cx="350" cy="195" r="120"/>
      <path d="M230 195H470M350 75V315" stroke-opacity=".14"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 350 195" to="360 350 195" dur="2.4s" repeatCount="indefinite"/>
      <path d="M350 195L265.1 110.1A120 120 0 0 1 350 75Z" fill="#10B981" fill-opacity=".14"/>
      <path d="M350 195V75" stroke="#34D399" stroke-width="2" stroke-linecap="round"/>
    </g>
    <circle cx="350" cy="195" r="4" fill="#34D399"/>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.22;.24;.32;.35;1" dur="10s" repeatCount="indefinite"/>
      <circle cx="412" cy="148" r="6" fill="#38BDF8"/>
      <circle cx="412" cy="148" r="6" fill="none" stroke="#38BDF8" stroke-width="2">
        <animate attributeName="r" values="6;24" dur="1s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values=".8;0" dur="1s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- popup -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.33;.36;.94;.97;1" dur="10s" repeatCount="indefinite"/>
    <rect x="195" y="105" width="310" height="175" rx="16" fill="#141418" stroke="#38BDF8" stroke-width="1.5">
      <animate attributeName="stroke" values="#38BDF8;#38BDF8;#10B981;#10B981" keyTimes="0;.54;.56;1" dur="10s" repeatCount="indefinite" calcMode="discrete"/>
    </rect>
    <text class="m" x="350" y="141" font-size="11" letter-spacing="1.8" text-anchor="middle" fill="#7DD3FC">MATCH FOUND</text>
    <text class="d" x="350" y="173" font-size="24" font-weight="700" letter-spacing="-.5" text-anchor="middle" fill="#F5F4F0">Your match is ready</text>
    <rect x="223" y="188" width="254" height="4" rx="2" fill="#26262C"/>
    <rect x="223" y="188" width="254" height="4" rx="2" fill="#38BDF8">
      <animate attributeName="width" values="254;254;60;254;254" keyTimes="0;.34;.54;.56;1" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#38BDF8;#38BDF8;#10B981;#10B981" keyTimes="0;.54;.56;1" dur="10s" repeatCount="indefinite" calcMode="discrete"/>
    </rect>
    <rect x="223" y="206" width="254" height="48" rx="10" fill="#10B981"/>
    <g>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.54;.56;1" dur="10s" repeatCount="indefinite"/>
      <text class="m" x="350" y="236" font-size="15" font-weight="700" letter-spacing="2" text-anchor="middle" fill="#022C1E">ACCEPT</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.54;.56;1" dur="10s" repeatCount="indefinite"/>
      <path d="M315 230l6 6 11-12" fill="none" stroke="#022C1E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="m" x="345" y="236" font-size="15" font-weight="700" letter-spacing="2" fill="#022C1E">ACCEPTED</text>
    </g>
  </g>

  <!-- click ripple -->
  <circle cx="350" cy="230" r="0" fill="none" stroke="#F5F4F0" stroke-width="2" opacity="0">
    <animate attributeName="r" values="0;0;30;30" keyTimes="0;.52;.62;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.7;0;0" keyTimes="0;.52;.62;1" dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- cursor -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.38;.40;.94;.97;1" dur="10s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="560 330;560 330;430 236;430 236" keyTimes="0;.38;.52;1" dur="10s" repeatCount="indefinite"/>
    <path d="M0 0L0 17L4.5 13L7.5 20L10.5 18.7L7.6 12H13Z" fill="#F5F4F0" stroke="#09090b" stroke-width="1.2" stroke-linejoin="round"/>
  </g>

  <!-- Windows toast -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.63;.66;.94;.97;1" dur="10s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 14;0 14;0 0;0 0" keyTimes="0;.63;.67;1" dur="10s" repeatCount="indefinite"/>
    <rect x="30" y="316" width="300" height="62" rx="12" fill="#141418" stroke="#34343C"/>
    <rect x="44" y="331" width="32" height="32" rx="8" fill="#09090b" stroke="#26262C"/>
    <path d="M52 347l5 5 10-11" fill="none" stroke="#F5F4F0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="46" y="356" width="9" height="5" fill="#38BDF8" opacity=".9"/>
    <rect x="53" y="356" width="9" height="5" fill="#10B981" opacity=".9"/>
    <text class="m" x="88" y="334" font-size="9.5" letter-spacing="1" fill="#7C7C86">AUTOREADY</text>
    <text class="d" x="88" y="350" font-size="14" font-weight="700" fill="#F5F4F0">Match accepted in Dota 2</text>
    <text class="d" x="88" y="367" font-size="12.5" fill="#9A9AA3">Come back, it's starting.</text>
  </g>

  <!-- phone -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.69;.72;.94;.97;1" dur="10s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 14;0 14;0 0;0 0" keyTimes="0;.69;.73;1" dur="10s" repeatCount="indefinite"/>
    <rect x="530" y="70" width="140" height="262" rx="24" fill="#0F0F12" stroke="#34343C" stroke-width="2"/>
    <rect x="577" y="80" width="46" height="9" rx="4.5" fill="#09090b"/>
    <text class="d" x="600" y="128" font-size="26" font-weight="700" text-anchor="middle" fill="#F5F4F0" fill-opacity=".85">9:41</text>
    <rect x="543" y="150" width="114" height="58" rx="12" fill="#141418" stroke="#26262C"/>
    <rect x="553" y="160" width="12" height="12" rx="3" fill="#10B981"/>
    <text class="m" x="571" y="170" font-size="8" letter-spacing=".8" fill="#7C7C86">NTFY · AUTOREADY</text>
    <text class="d" x="553" y="188" font-size="11" font-weight="700" fill="#F5F4F0">Match accepted</text>
    <text class="d" x="553" y="201" font-size="9.5" fill="#9A9AA3">Come back, it's starting.</text>
  </g>
</svg>
