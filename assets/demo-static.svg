<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" role="img" aria-label="AutoReady demo: the Match found popup in Dota 2 was accepted automatically, and a Windows notification and a phone notification say Match accepted.">
<defs>
<radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="126" cy="178" r="260"><stop offset="0" stop-color="#10B981" stop-opacity=".09"/><stop offset="1" stop-color="#10B981" stop-opacity="0"/></radialGradient>
<filter id="shw" filterUnits="userSpaceOnUse" x="0" y="0" width="700" height="400" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000" flood-opacity=".8"/><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity=".6"/></filter>
<filter id="shwt" filterUnits="userSpaceOnUse" x="0" y="0" width="700" height="400" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".6"/></filter>
<symbol id="logo" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#09090B"/><g transform="translate(256 256) scale(.84) translate(-203 -283)"><polyline points="86.48,263.72 61.02,238.26" fill="none" stroke="#38BDF8" stroke-width="84"/><polyline points="18.61,269.37 -4.02,246.74" fill="none" stroke="#10B981" stroke-width="84"/><polyline points="78,292 188,402 352,198" fill="none" stroke="#F5F4F0" stroke-width="84" stroke-linejoin="miter"/><polygon points="440,104 274,160 412,280" fill="#F5F4F0"/></g></symbol>
</defs>
<style>.d{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,'SF Pro Display',Inter,Helvetica,Arial,sans-serif}.t{font-family:'Segoe UI Variable Text','Segoe UI',-apple-system,'SF Pro Text',Inter,Helvetica,Arial,sans-serif}.m{font-family:'Cascadia Mono',Consolas,Menlo,monospace}</style>
<rect width="700" height="400" fill="#09090B"/>
<rect width="700" height="400" fill="url(#glow)"/>
<g class="d" font-weight="700" font-size="48" letter-spacing="-1.44">
<text x="404" y="78" fill="#F5F4F0">Queue up.</text>
<text x="404" y="132" fill="#7C7C86">Step away.</text></g>
<text class="t" x="40" y="296" font-size="14" fill="#8A8A94">Dota 2, CS2 and League of Legends</text>
<g class="t" font-size="16" fill="#A1A1AA"><text x="40" y="334">Accepts the match for you,</text><text x="40" y="356">then pings your PC and phone.</text></g>
<g>
<g filter="url(#shw)"><rect x="40.5" y="44.5" width="339" height="179" rx="8" fill="#141418" stroke="#34343C"/></g>
<path d="M48.5 45h323" stroke="#fff" stroke-opacity=".06" fill="none"/>
<rect x="60" y="52" width="16" height="16" rx="4" fill="#2B2B33"/><path d="M68 56.5v7M64.5 60h7" stroke="#9A9AA3" stroke-width="1.6" stroke-linecap="round"/>
<text class="t" x="84" y="64" font-size="13" fill="#9A9AA3">Dota 2</text>
<g fill="none" stroke="#9A9AA3" stroke-width="1"><path d="M290 60h10"/><rect x="320.5" y="55.5" width="9" height="9" rx="1.5"/><path d="M350 55l10 10M360 55l-10 10"/></g>
<text class="d" x="60" y="116" font-size="28" font-weight="700" letter-spacing="-.56" fill="#F5F4F0">Match found</text>
<text class="t" x="60" y="140" font-size="14" fill="#9A9AA3" opacity="0">Accepting for you…</text>
<text class="t" x="60" y="140" font-size="14" fill="#9A9AA3" opacity="1">Waiting for players…</text>
<rect x="60" y="158" width="132" height="40" rx="6" fill="#10B981"></rect>
<g class="t" font-size="15" font-weight="600" fill="#022C1E" text-anchor="middle" opacity="0"><text x="126" y="183.5">Accept</text></g>
<g class="t" font-size="15" font-weight="600" fill="#022C1E" text-anchor="middle" opacity="1"><text x="137" y="183.5">Accepted</text><path d="M84 178.5l4.5 4.5 8.5-9.5" fill="none" stroke="#022C1E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></g>
<g>
<g filter="url(#shwt)"><rect x="404" y="184" width="256" height="96" rx="8" fill="#2C2C2C"/></g>
<rect x="404.5" y="184.5" width="255" height="95" rx="7.5" fill="none" stroke="#fff" stroke-opacity=".08"/>
<use href="#logo" x="420" y="198" width="16" height="16"/>
<g class="t" fill="#fff"><text x="444" y="211" font-size="13" fill-opacity=".7">AutoReady</text><text x="644" y="212" font-size="16" fill-opacity=".7" text-anchor="end">…</text>
<text x="420" y="241" font-size="14" font-weight="600">Match accepted in Dota 2</text><text x="420" y="261" font-size="14" fill-opacity=".79">Come back, it's starting.</text></g></g>
<g>
<g filter="url(#shwt)"><rect x="404" y="292" width="256" height="68" rx="20" fill="#2A2A2E"/></g>
<rect x="404.5" y="292.5" width="255" height="67" rx="19.5" fill="none" stroke="#fff" stroke-opacity=".09"/>
<rect x="418" y="307" width="38" height="38" rx="9" fill="#338574"/>
<path d="M428.5 317h17a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-8l-4.5 4v-4h-4.5a2 2 0 0 1-2-2v-10a2 2 0 0 1 2-2z" fill="#fff"/>
<path d="M432 321.5l4.5 3.5-4.5 3.5M438.5 328.5h4" fill="none" stroke="#338574" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<g class="t" fill="#fff"><text x="466" y="313" font-size="15" font-weight="700">ntfy</text><text x="644" y="313" font-size="13" fill-opacity=".55" text-anchor="end">now</text>
<text x="466" y="331" font-size="14" font-weight="700">Match accepted</text><text x="466" y="348" font-size="14" fill-opacity=".78">Come back, it's starting.</text></g></g>
</g></svg>
