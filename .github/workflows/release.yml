# Al subir un tag vX.Y.Z: compila AutoReady.exe con esa version y publica el Release con el exe y su SHA-256.
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          & "$env:GITHUB_WORKSPACE\build.bat" $version
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Si Microsoft Defender marca el exe, no se publica: mejor enterarse aca que por un usuario.
      - name: Scan with Microsoft Defender
        shell: pwsh
        run: |
          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          if (-not (Test-Path $mp)) { Write-Host "Defender no disponible en el runner; se omite el escaneo"; exit 0 }
          & $mp -SignatureUpdate | Out-Null
          & $mp -Scan -ScanType 3 -File "$env:GITHUB_WORKSPACE\dist\AutoReady.exe" -DisableRemediation
          if ($LASTEXITCODE -eq 2) { Write-Error "Defender detecto una amenaza en AutoReady.exe"; exit 1 }
          exit 0

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/AutoReady.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content dist/AutoReady.exe.sha256 "$hash  AutoReady.exe" -Encoding ascii -NoNewline
          "SHA-256: $hash"

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Mientras sea 0.x (beta) se publica como pre-release.
          $pre = if ($env:GITHUB_REF_NAME -like 'v0.*') { '--prerelease' } else { $null }
          gh release create $env:GITHUB_REF_NAME dist/AutoReady.exe dist/AutoReady.exe.sha256 --title "AutoReady $env:GITHUB_REF_NAME" --generate-notes $pre
