# Al subir un tag vX.Y.Z: compila AutoReady.exe con esa version, lo escanea con Defender, lo firma con SignPath (si
# esta configurado) y publica el Release con el exe y su SHA-256.
#
# Firma (SignPath Foundation): se activa sola cuando existen en el repo la variable SIGNPATH_ORGANIZATION_ID y el
# secreto SIGNPATH_API_TOKEN (Settings > Secrets and variables > Actions). Cada firma se aprueba a mano en SignPath.
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # Si alguna prueba falla, no se publica la version.
      - name: Tests
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\tests.bat"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          & "$env:GITHUB_WORKSPACE\build.bat" $version
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Si Microsoft Defender marca el exe, no se publica: mejor enterarse aca que por un usuario.
      - name: Scan with Microsoft Defender
        shell: pwsh
        run: |
          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          if (-not (Test-Path $mp)) { Write-Host "Defender no disponible en el runner; se omite el escaneo"; exit 0 }
          & $mp -SignatureUpdate | Out-Null
          & $mp -Scan -ScanType 3 -File "$env:GITHUB_WORKSPACE\dist\AutoReady.exe" -DisableRemediation
          if ($LASTEXITCODE -eq 2) { Write-Error "Defender detecto una amenaza en AutoReady.exe"; exit 1 }
          exit 0

      - name: Upload unsigned build
        id: unsigned
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: AutoReady-unsigned
          path: dist/AutoReady.exe
          if-no-files-found: error

      - name: Sign with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: autoready
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist-signed

      - name: Use signed build
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: |
          Copy-Item dist-signed/AutoReady.exe dist/AutoReady.exe -Force
          $sig = Get-AuthenticodeSignature dist/AutoReady.exe
          "Firma: $($sig.Status) - $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { Write-Error "El exe firmado no tiene una firma valida"; exit 1 }

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/AutoReady.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content dist/AutoReady.exe.sha256 "$hash  AutoReady.exe" -Encoding ascii -NoNewline
          "SHA-256: $hash"

      # Prueba publica de que el exe salio de este repo y de este workflow: gh attestation verify AutoReady.exe -R hercase/autoready
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/AutoReady.exe

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Se publica como "latest" (no pre-release): el boton de descarga del README usa
          # releases/latest/download/AutoReady.exe, que ignora las pre-releases. La beta se indica con la version 0.x.
          $notes = "Code signing policy: https://github.com/hercase/autoready#code-signing-policy`n`nPrivacy policy: https://github.com/hercase/autoready/blob/main/PRIVACY.md"
          gh release create $env:GITHUB_REF_NAME dist/AutoReady.exe dist/AutoReady.exe.sha256 --title "AutoReady $env:GITHUB_REF_NAME" --notes "$notes" --generate-notes --latest
